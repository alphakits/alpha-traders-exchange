<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha responsive verification</title><style>body{margin:0;background:#202124;color:white;font:16px system-ui}header{position:sticky;top:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px;background:#111;z-index:1}label{display:grid;gap:5px}select{font:inherit;padding:5px}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #666;background:#050505}p{margin:4px 0}</style><header><label>Page<select id="page"><option value="/learn-trading-free">Free course</option><option value="/learn-with-mark">Paid learning enquiry</option><option value="/start">Choose a path</option><option value="/buy-usdt-israel">Exchange guide</option><option value="/login">Sign in</option><option value="/register">Create account</option><option value="">Home</option></select></label><label>Language<select id="lang"><option value="en">English</option><option value="ar">Arabic</option></select></label><label>Width<select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><p>Preview-only viewport check · Real pages · No form submissions</p></header><main><iframe id="phone" title="Website at selected width" width="390" height="844" src="/en/learn-trading-free"></iframe></main><script>
