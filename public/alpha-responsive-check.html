<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha responsive verification</title><style>body{margin:0;background:#202124;color:white;font:16px system-ui}header{position:sticky;top:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px;background:#111;z-index:1}label{display:grid;gap:5px}select{font:inherit;padding:5px}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #666;background:#050505}p{margin:4px 0}</style><header><label>Page<select id="page"><option value="/learn-trading-free">Free course</option><option value="/learn-with-mark">Paid learning enquiry</option><option value="/start">Choose a path</option><option value="/buy-usdt-israel">Exchange guide</option><option value="/login">Sign in</option><option value="/register">Create account</option><option value="">Home</option></select></label><label>Language<select id="lang"><option value="en">English</option><option value="ar">Arabic</option></select></label><label>Width<select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><button id="open" type="button">Open phone preview</button><p>Preview-only viewport check · Real pages · No form submissions</p></header><main><p>Open a separate window at the chosen width. The site retains its framing protections.</p></main><script>
const page=document.getElementById('page'),lang=document.getElementById('lang'),width=document.getElementById('width');let preview;
function destination(){let path='/'+lang.value+page.value;if(page.value==='/login')path+='?redirectTo=%2F'+lang.value+'%2Facademy';if(page.value==='/register')path+='?intent=learn';return path;}
function resize(){if(preview&&!preview.closed){preview.resizeTo(Number(width.value)+(preview.outerWidth-preview.innerWidth),844+(preview.outerHeight-preview.innerHeight));}}
document.getElementById('open').addEventListener('click',()=>{preview=window.open(destination(),'alpha-phone-preview','popup,width='+width.value+',height=844');});
width.addEventListener('change',resize);
page.addEventListener('change',()=>{if(preview&&!preview.closed)preview.location.href=destination();});
lang.addEventListener('change',()=>{if(preview&&!preview.closed)preview.location.href=destination();});
</script></html>
