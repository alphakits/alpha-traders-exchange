name: Alpha Traders Native App Audit

# Started by GitHub's Native App Audit job, with the exact checked-out source.
# Public navigation uses no customer accounts and submits no transactions.
jobs:
  android:
    type: build
    environment: preview
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    params:
      platform: android
      profile: preview

  ios_simulator:
    type: build
    environment: preview
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    params:
      platform: ios
      profile: audit-simulator

  android_navigation:
    needs: [android]
    type: maestro
    runs_on: linux-large-nested-virtualization
    params:
      build_id: ${{ needs.android.outputs.build_id }}
      flow_path: .maestro
      retries: 0
      record_screen: true
      android_system_image_package: 'system-images;android-35;google_apis;x86_64'

  ios_navigation:
    needs: [ios_simulator]
    type: maestro
    params:
      build_id: ${{ needs.ios_simulator.outputs.build_id }}
      flow_path: .maestro
      retries: 0
      record_screen: true

  legacy_android_recovery:
    needs: [android]
    type: maestro
    params:
      build_id: ${{ needs.android.outputs.build_id }}
      flow_path: .maestro-legacy
      retries: 0
      record_screen: true
      android_system_image_package: 'system-images;android-29;default;x86_64'
