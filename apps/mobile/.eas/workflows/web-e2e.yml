name: Alpha Exchange Exact Release Browser Reliability
run_name: Browser reliability • release e15f917

on:
  workflow_dispatch: {}

jobs:
  browser_e2e:
    name: Run 148 Chromium exchange flows
    runs_on: linux-medium
    env:
      CI: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_HTML_OUTPUT_DIR: apps/mobile/playwright-report
    steps:
      - uses: eas/checkout
        with:
          ref: e15f917cb6a868969296c2b431cdd2a8e87f3fdc
      - name: Verify the exact release source
        run: |
          test "$(git rev-parse HEAD)" = "e15f917cb6a868969296c2b431cdd2a8e87f3fdc"
          test "$(git rev-parse HEAD^{tree})" = "160fb6d1a66f555239a3950001ec4cd1efa55964"
          git diff --exit-code
          git diff --cached --exit-code
          git log -1 --format='Verified release source: %H'
        working_directory: ../..
      - uses: eas/install_node_modules
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working_directory: ../..
      - name: Run production-mode browser reliability suite
        run: npx playwright test --reporter=list,html --output=apps/mobile/playwright-results
        working_directory: ../..
      - name: Upload browser evidence
        uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: alpha-exchange-browser-evidence
          path: |
            playwright-report/**/*
            playwright-results/**/*
          ignore_error: true
