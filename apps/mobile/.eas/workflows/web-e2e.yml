name: Alpha Exchange Isolated Draft Browser Reliability
run_name: Browser reliability • draft c920483

on:
  workflow_dispatch: {}

jobs:
  browser_e2e:
    name: Run Chromium exchange regression suite
    runs_on: linux-medium
    environment: preview
    env:
      CI: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_JSON_OUTPUT_NAME: apps/mobile/playwright-results.json
      PLAYWRIGHT_HTML_OUTPUT_DIR: apps/mobile/playwright-report
    steps:
      - uses: eas/checkout
        with:
          ref: c920483507e9689800d3b990696a68929b337553
      - name: Verify the exact draft source
        run: |
          test "$(git rev-parse HEAD)" = "c920483507e9689800d3b990696a68929b337553"
          test "$(git rev-parse HEAD^{tree})" = "d270ed335cafb89aac1355e22a61906867ce8db7"
          git diff --exit-code
          git diff --cached --exit-code
          git log -1 --format='Verified draft source: %H'
        working_directory: ../..
      - uses: eas/install_node_modules
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working_directory: ../..
      - name: Run production-mode browser reliability suite
        run: npx playwright test --reporter=line,html,json --output=apps/mobile/playwright-results 2>&1 | tee apps/mobile/playwright-run.log
        working_directory: ../..
      - name: Upload browser evidence
        uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: alpha-exchange-browser-evidence
          path: |
            apps/mobile/playwright-report/**/*
            apps/mobile/playwright-results/**/*
            apps/mobile/playwright-results.json
            apps/mobile/playwright-run.log
          ignore_error: false
