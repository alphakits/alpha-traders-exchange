name: Alpha Exchange Isolated Draft Browser Reliability
run_name: Browser reliability • draft 7eb2fdc

on:
  workflow_dispatch: {}

jobs:
  browser_e2e:
    name: Run Chromium exchange regression suite
    runs_on: linux-medium
    environment: preview
    env:
      CI: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_JSON_OUTPUT_NAME: apps/mobile/playwright-results.json
      PLAYWRIGHT_HTML_OUTPUT_DIR: apps/mobile/playwright-report
    steps:
      - uses: eas/checkout
        with:
          ref: 7eb2fdc9061a831c38a57365a24313d702cb0580
      - name: Verify the exact draft source
        run: |
          test "$(git rev-parse HEAD)" = "7eb2fdc9061a831c38a57365a24313d702cb0580"
          test "$(git rev-parse HEAD^{tree})" = "f8aa47beacc7fc0d7fb652d1a625c4b081760950"
          git diff --exit-code
          git diff --cached --exit-code
          git log -1 --format='Verified draft source: %H'
        working_directory: ../..
      - uses: eas/install_node_modules
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working_directory: ../..
      - name: Run production-mode browser reliability suite
        run: npx playwright test --retries=0 --trace=retain-on-failure --reporter=line,html,json --output=apps/mobile/playwright-results 2>&1 | tee apps/mobile/playwright-run.log
        working_directory: ../..
      - name: Upload browser evidence
        uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: alpha-exchange-browser-evidence
          path: |
            apps/mobile/playwright-report/**/*
            apps/mobile/playwright-results/**/*
            apps/mobile/playwright-results.json
            apps/mobile/playwright-run.log
          ignore_error: false
