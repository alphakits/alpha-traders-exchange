name: Alpha Traders Published iOS Navigation and Menu Verification

on:
  workflow_dispatch:
    inputs:
      ios_build_id:
        type: string
        required: true

jobs:
  ios_terms_en:
    type: maestro
    params:
      build_id: ${{ inputs.ios_build_id }}
      flow_path: .maestro/public-navigation-en.yml
      retries: 0
      record_screen: true
