name: iPhone Expo Go Preview

on:
  push:
    branches: [release/phone-preview-20260907]

jobs:
  publish_preview:
    name: Publish phone preview
    type: update
    environment: preview
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    params:
      platform: all
      channel: phone-preview
      message: Alpha Traders exact website parity update
    hooks:
      after_install_node_modules:
        - name: Expose Expo runtime to update tools
          run: test -e node_modules/expo || ln -s ../apps/mobile/node_modules/expo node_modules/expo
          working_directory: ../..
