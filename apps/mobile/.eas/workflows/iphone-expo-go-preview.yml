name: iPhone Expo Go Preview

on:
  push:
    branches: [release/expo-phone-preview]

jobs:
  publish_preview:
    name: Publish phone preview
    type: update
    environment: preview
    env:
      # Defense in depth for custom steps. Initial checkout is handled by the
      # release branch's .lfsconfig because job env starts after repository clone.
      GIT_LFS_SKIP_SMUDGE: "1"
    params:
      platform: all
      branch: phone-preview
      message: Alpha Traders native website parity preview
    hooks:
      after_install_node_modules:
        - name: Expose Expo runtime to update tools
          run: test -e node_modules/expo || ln -s ../apps/mobile/node_modules/expo node_modules/expo
          working_directory: ../..
