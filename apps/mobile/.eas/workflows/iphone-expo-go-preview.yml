name: iPhone Expo Go Preview

on:
  push:
    branches: [main]

jobs:
  publish_preview:
    name: Publish phone preview
    type: update
    environment: preview
    env:
      # The native app does not use the website's Git LFS course videos, and
      # GitHub currently blocks their download after the LFS budget is spent.
      # Keep the website assets tracked while preventing EAS checkout from
      # smudging unrelated video pointers before the update job starts.
      GIT_LFS_SKIP_SMUDGE: "1"
    params:
      platform: all
      branch: phone-preview
      message: Alpha Traders native website parity preview
    hooks:
      after_install_node_modules:
        - name: Expose Expo runtime to update tools
          run: test -e node_modules/expo || ln -s ../apps/mobile/node_modules/expo node_modules/expo
          working_directory: ../..
