appId: com.alphakits.alphatraders
---
# Full regression scope: EN/AR home and Terms on Android + iOS, plus legacy recovery (9 journeys).
# Preserve every target assertion; this scan/recovery helper is the corrected production driver.
# Scan the complete page, then recover a target passed during inertial scroll.
# Reaching the footer ends the downward search; the final assertion is required.
- evalScript: ${output.alphaScrollReachedBottom = false}
- repeat:
    times: 100
    while:
      notVisible: "${TARGET_TEXT}"
      true: ${!output.alphaScrollReachedBottom}
    commands:
      - runFlow:
          when:
            visible: ".*(Platform Status: Operational|حالة المنصة: تعمل).*"
          commands:
            - evalScript: ${output.alphaScrollReachedBottom = true}
      - runFlow:
          when:
            true: ${!output.alphaScrollReachedBottom}
          commands:
            - swipe:
                start: 50%, 80%
                end: 50%, 25%
                duration: 800
                waitToSettleTimeoutMs: 500
- repeat:
    times: 50
    while:
      notVisible: "${TARGET_TEXT}"
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 65%
          duration: 800
          waitToSettleTimeoutMs: 500
# Accessibility may report text under the iOS home indicator as visible.
# Move the fully visible target into the touch viewport before a caller taps it.
- scrollUntilVisible:
    element: "${TARGET_TEXT}"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    speed: 25
    timeout: 30000
- assertVisible: "${TARGET_TEXT}"
