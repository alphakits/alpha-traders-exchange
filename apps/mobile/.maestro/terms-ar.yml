appId: com.alphakits.alphatraders
name: Arabic footer and canonical commission terms
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Open menu|فتح القائمة"
    timeout: 60000
- runFlow:
    when:
      visible: "Switch to Arabic|العربية"
    commands:
      - tapOn: "Switch to Arabic|العربية"
- scrollUntilVisible:
    element: ".*قانوني.*"
    timeout: 180000
    speed: 85
    visibilityPercentage: 60
- tapOn: ".*قانوني.*"
- scrollUntilVisible:
    element: ".*الشروط.*"
    timeout: 30000
- tapOn: ".*الشروط.*"
- scrollUntilVisible:
    element: ".*1%.*المشتري.*1%.*البائع.*2%.*"
    timeout: 30000
    visibilityPercentage: 30
- assertVisible: ".*1%.*المشتري.*1%.*البائع.*2%.*"
- takeScreenshot: terms-ar
