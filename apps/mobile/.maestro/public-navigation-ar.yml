appId: com.alphakits.alphatraders
name: Arabic homepage and guest navigation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Open menu|فتح القائمة"
    timeout: 60000
- runFlow:
    when:
      visible: "Switch to Arabic|العربية"
    commands:
      - tapOn: "Switch to Arabic|العربية"
- assertVisible: "فتح القائمة"
- tapOn: "فتح القائمة"
- tapOn: "المجتمع"
- assertVisible: "مساحة تعليمية منظمة للتطبيق.*"
- tapOn: "فتح القائمة"
- tapOn: "الرئيسية"
- tapOn: "فتح القائمة"
- tapOn: "تواصل معنا"
- assertVisible: ".*للاستفسارات والشراكات التعليمية.*"
- tapOn: "فتح القائمة"
- tapOn: "الرئيسية"
- tapOn: "فتح القائمة"
- tapOn: "الأكاديمية"
- assertVisible: "تجربة دخول مميزة"
- scrollUntilVisible:
    element: "نسيت كلمة المرور؟"
    timeout: 30000
- tapOn: "نسيت كلمة المرور؟"
- assertVisible: "إعادة تعيين كلمة المرور"
- tapOn: "فتح القائمة"
- tapOn: "الرئيسية"
