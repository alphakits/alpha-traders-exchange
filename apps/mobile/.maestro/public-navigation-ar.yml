appId: com.alphakits.alphatraders
name: Arabic homepage and guest navigation
---
# EAS can briefly lose its emulator transport during the first launch.
# Retry only app startup; navigation and business assertions run once.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
- extendedWaitUntil:
    visible: "Open menu|فتح القائمة"
    timeout: 60000
- runFlow:
    when:
      visible: "Switch to Arabic|العربية"
    commands:
      - tapOn: "Switch to Arabic|العربية"
- extendedWaitUntil:
    visible: "فتح القائمة"
    timeout: 60000
- assertVisible: "فتح القائمة"
- tapOn: "فتح القائمة"
- tapOn: "المجتمع"
- assertVisible: "مساحة تعليمية منظمة للتطبيق.*"
- tapOn: "فتح القائمة"
- tapOn: "الرئيسية"
- tapOn: "فتح القائمة"
- tapOn: "تواصل معنا"
- assertVisible: ".*للاستفسارات والشراكات التعليمية.*"
- tapOn: "فتح القائمة"
- tapOn: "الرئيسية"
- tapOn: "فتح القائمة"
- tapOn: "الأكاديمية"
# Guests can discover the free course before entering the protected lessons.
- assertVisible: ".*دورة تداول مجانية للمبتدئين.*"
- runFlow:
    file: ../.maestro-helpers/scroll-to-text.yml
    env:
      TARGET_TEXT: "ابدأ الدورة المجانية"
- tapOn: "ابدأ الدورة المجانية"
- assertVisible: "تجربة دخول مميزة"
- runFlow:
    file: ../.maestro-helpers/scroll-to-text.yml
    env:
      TARGET_TEXT: "هل نسيت كلمة المرور؟"
- tapOn: "هل نسيت كلمة المرور؟"
- assertVisible: "نسيت كلمة المرور"
- tapOn: "شعار Alpha Traders.*"
- runFlow:
    file: ../.maestro-helpers/scroll-to-text.yml
    env:
      TARGET_TEXT: "ادخل إلى Alpha Exchange"
- tapOn: "ادخل إلى Alpha Exchange"
- assertVisible: "تجربة دخول مميزة"
- tapOn: "شعار Alpha Traders.*"
- assertVisible: "فتح القائمة"
- takeScreenshot: public-navigation-ar
