appId: com.alphakits.alphatraders
name: English homepage and guest navigation
---
# EAS can briefly lose its emulator transport during the first launch.
# Retry only app startup; navigation and business assertions run once.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
- extendedWaitUntil:
    visible: "Open menu|فتح القائمة"
    timeout: 60000
- runFlow:
    when:
      visible: "English|التبديل إلى الإنجليزية"
    commands:
      - tapOn: "English|التبديل إلى الإنجليزية"
- assertVisible: "Open menu"
- tapOn: "Open menu"
- tapOn: "Community"
- assertVisible: "A structured space for practice, accountability, and professional discussion."
- tapOn: "Open menu"
- tapOn: "Home"
- tapOn: "Open menu"
- tapOn: "Contact"
- assertVisible: ".*inquiries and educational partnerships.*"
- tapOn: "Open menu"
- tapOn: "Home"
- tapOn: "Open menu"
- tapOn: "Academy"
- assertVisible: "Premium Sign In"
- runFlow:
    file: ../.maestro-helpers/scroll-to-text.yml
    env:
      TARGET_TEXT: "Forgot your password[?]"
- tapOn: "Forgot your password[?]"
- assertVisible: "Forgot Password"
- tapOn: "Alpha Traders.*logo.*"
- runFlow:
    file: ../.maestro-helpers/scroll-to-text.yml
    env:
      TARGET_TEXT: "Enter Alpha Exchange"
- tapOn: "Enter Alpha Exchange"
- assertVisible: "Premium Sign In"
- tapOn: "Alpha Traders.*logo.*"
- assertVisible: "Open menu"
- takeScreenshot: public-navigation-en
