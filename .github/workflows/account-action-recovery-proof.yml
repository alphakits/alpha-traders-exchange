name: Account action recovery proof

on:
  push:
    branches: [fix/account-action-recovery-proof-v2-20261004]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://www.alphatraders.co.il
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  recovery-proof:
    name: Original failure and corrected recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: cc54d8d3721c411a5af7efd161d65700129e35eb
          lfs: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prove failures against the published baseline and recovery against the candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cc54d8d3721c411a5af7efd161d65700129e35eb"
          git fetch --no-tags --depth=1 origin 1fd66b5b6af605782e7d5c98b9b91975c8efc678
          mkdir -p account-action-proof
          git show 1fd66b5b6af605782e7d5c98b9b91975c8efc678:src/components/auth/account-verification-gate.tsx > src/components/auth/account-verification-gate.tsx
          git show 1fd66b5b6af605782e7d5c98b9b91975c8efc678:src/components/auth/buyer-contact-prompt.tsx > src/components/auth/buyer-contact-prompt.tsx
          git show 1fd66b5b6af605782e7d5c98b9b91975c8efc678:src/components/auth/logout-button.tsx > src/components/auth/logout-button.tsx
          set +e
          npx vitest run src/components/auth/account-verification-recovery.test.tsx src/__tests__/buyer-contact-recovery.test.tsx src/__tests__/logout-request-recovery.test.tsx --reporter=json --outputFile=account-action-proof/before.json > account-action-proof/before.log 2>&1
          before_exit=$?
          set -e
          git show cc54d8d3721c411a5af7efd161d65700129e35eb:src/components/auth/account-verification-gate.tsx > src/components/auth/account-verification-gate.tsx
          git show cc54d8d3721c411a5af7efd161d65700129e35eb:src/components/auth/buyer-contact-prompt.tsx > src/components/auth/buyer-contact-prompt.tsx
          git show cc54d8d3721c411a5af7efd161d65700129e35eb:src/components/auth/logout-button.tsx > src/components/auth/logout-button.tsx
          set +e
          npx vitest run src/components/auth/account-verification-recovery.test.tsx src/__tests__/buyer-contact-recovery.test.tsx src/__tests__/logout-request-recovery.test.tsx src/components/auth/account-verification-gate.test.tsx src/__tests__/buyer-contact-prompt.test.tsx src/__tests__/auth-request-recovery.test.tsx src/__tests__/logout-button.test.tsx src/__tests__/interactive-action-wiring.test.ts --reporter=json --outputFile=account-action-proof/after.json > account-action-proof/after.log 2>&1
          after_exit=$?
          set -e
          export before_exit after_exit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const before=JSON.parse(fs.readFileSync('account-action-proof/before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('account-action-proof/after.json','utf8'));
          const summarize=r=>({total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests,success:r.success,files:r.testResults.map(f=>({file:f.name.split('/').slice(-4).join('/'),status:f.status,assertions:f.assertionResults.map(a=>({name:a.fullName,status:a.status}))}))});
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'cc54d8d3721c411a5af7efd161d65700129e35eb');
          assert.equal(before.numTotalTests,55);
          assert.ok(before.numFailedTests>0,'The new regression tests must reproduce original failures');
          assert.notEqual(Number(process.env.before_exit),0);
          assert.equal(before.numPendingTests,0);
          assert.equal(after.numTotalTests,75);
          assert.equal(after.numPassedTests,75);
          assert.equal(after.numFailedTests,0);
          assert.equal(after.numPendingTests,0);
          assert.equal(Number(process.env.after_exit),0);
          for(const path of ["src/components/auth/account-verification-gate.tsx","src/components/auth/buyer-contact-prompt.tsx","src/components/auth/logout-button.tsx"]) assert.equal(fs.readFileSync(path,'utf8'),execFileSync('git',['show','cc54d8d3721c411a5af7efd161d65700129e35eb:'+path],{encoding:'utf8'}));
          const proof={baseline:'1fd66b5b6af605782e7d5c98b9b91975c8efc678',candidate:'cc54d8d3721c411a5af7efd161d65700129e35eb',isolatedSyntheticFixtures:true,customerRecordsRead:false,messagesSent:false,financialTransactions:false,nativePackagesChanged:false,dependenciesChanged:false,before:summarize(before),after:summarize(after),completedAt:new Date().toISOString()};
          fs.writeFileSync('account-action-proof/proof.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify({before:{total:before.numTotalTests,passed:before.numPassedTests,failed:before.numFailedTests},after:{total:after.numTotalTests,passed:after.numPassedTests,failed:after.numFailedTests},candidate:proof.candidate}));
          NODE
      - name: Preserve the reproducible proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-action-recovery-proof
          path: account-action-proof
          if-no-files-found: error
          retention-days: 14
