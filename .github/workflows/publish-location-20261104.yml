name: Publish reviewed Face-to-Face location source

on:
  push:
    branches: [ops/publish-location-20261104]
    paths: [.github/workflows/publish-location-20261104.yml]

permissions:
  contents: write

concurrency:
  group: publish-location-20261104
  cancel-in-progress: false

jobs:
  publish-reviewed-source:
    if: github.repository == 'alphakits/alpha-traders-exchange' && github.ref == 'refs/heads/ops/publish-location-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the isolated publishing branch without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
          lfs: false
      - name: Reconstruct and verify the exact previously tested source tree
        id: source
        env:
          BASE_COMMIT: 5893c3fe6bfe918e10f0a93f50106202876ce35f
          EXPECTED_TREE: d4a9d6e5b72f0cae7bd232e1fd3f412b34bc8ef4
          PATCH_SHA256: 4514a280afaec801c33f237390af8ba52587f3380a36aab232a44288506b41f7
          GIT_AUTHOR_NAME: Alpha Traders Release Automation
          GIT_AUTHOR_EMAIL: release-automation@users.noreply.github.com
          GIT_COMMITTER_NAME: Alpha Traders Release Automation
          GIT_COMMITTER_EMAIL: release-automation@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          patch_file="$RUNNER_TEMP/location-reviewed.patch"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 --max-filesize 1000000 'https://sb-3lk6wthezxr7.vercel.run/location-feature.patch' -o "$patch_file"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch_file" | sha256sum --check --strict
          export GIT_INDEX_FILE="$RUNNER_TEMP/location-release.index"
          git read-tree "$BASE_COMMIT"
          git apply --cached --check "$patch_file"
          git apply --cached "$patch_file"
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_TREE"
          release_commit="$(git commit-tree "$actual_tree" -p "$BASE_COMMIT" -m 'feat: private Face-to-Face meeting locations with reviewed safety and usability checks')"
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'Verified source tree: %s\nRelease commit: %s\n' "$actual_tree" "$release_commit"
      - name: Publish only the separate release branch, never main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "$RELEASE_COMMIT:refs/heads/release/face-to-face-location-20261104"
          printf 'Published reviewed source. Production remains unchanged.\n'
