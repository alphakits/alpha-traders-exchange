name: Import reviewed Face-to-Face location release

on:
  push:
    branches: [release/face-to-face-location-20261104]
    paths: [.github/workflows/publish-reviewed-location.yml]

permissions:
  contents: read

concurrency:
  group: import-reviewed-location-20261104
  cancel-in-progress: false

env:
  PATCH_URL: https://sb-3lk6wthezxr7.vercel.run/location-feature.patch
  PATCH_SHA256: 174ac566da23fefe47e118d829d7355d159489a3a072ca9b13556e59cc32a568
  SOURCE_TREE: d4a9d6e5b72f0cae7bd232e1fd3f412b34bc8ef4
  BASE_COMMIT: 5893c3fe6bfe918e10f0a93f50106202876ce35f

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Import exact reviewed source without running downloaded code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          curl --fail --silent --show-error --retry 2 --max-time 60 "$PATCH_URL" -o "$RUNNER_TEMP/location.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/location.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/location.patch"
          git apply --index "$RUNNER_TEMP/location.patch"
          cp .git/index "$RUNNER_TEMP/reviewed.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/reviewed.index" git update-index --force-remove .github/workflows/publish-reviewed-location.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/reviewed.index" git write-tree)" = "$SOURCE_TREE"
          git diff --cached --check
      - name: Install verified Node.js release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.gz -o "$RUNNER_TEMP/node.tar.gz"
          printf '%s  %s\n' eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c "$RUNNER_TEMP/node.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/node24"
          tar -xzf "$RUNNER_TEMP/node.tar.gz" -C "$RUNNER_TEMP/node24" --strip-components=1
          echo "$RUNNER_TEMP/node24/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies and existing security patches
        run: npm ci --no-audit --no-fund
      - name: Verify location and seller-guide regressions without production credentials
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://www.alphatraders.co.il
        run: |
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 src/lib/trade-location.test.ts src/__tests__/trade-chat.test.ts src/__tests__/trade-room-message-route.test.ts src/lib/security-headers.test.ts src/components/sections/trade-room/trade-location-composer.test.tsx src/components/sections/trade-room/trade-location-map.test.tsx src/components/sections/trade-room/trade-room-feedback.test.tsx src/components/sections/trade-room/trade-room-page.test.ts src/__tests__/admin-announcement-attachment-delivery.test.ts src/__tests__/admin-announcement-attachment-routes.test.ts src/__tests__/admin-announcements.test.ts src/components/admin/admin-announcements-panel.test.tsx src/lib/admin-announcement-attachment.test.ts
          node node_modules/typescript/bin/tsc --noEmit --incremental false

  publish_branch:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Recheck the same immutable reviewed files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          curl --fail --silent --show-error --retry 2 --max-time 60 "$PATCH_URL" -o "$RUNNER_TEMP/location.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/location.patch" | sha256sum --check --strict
          git apply --index "$RUNNER_TEMP/location.patch"
          cp .git/index "$RUNNER_TEMP/reviewed.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/reviewed.index" git update-index --force-remove .github/workflows/publish-reviewed-location.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/reviewed.index" git write-tree)" = "$SOURCE_TREE"
          git diff --cached --check
      - name: Publish verified source to the release branch only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/face-to-face-location-20261104 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'Alpha Traders release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish verified Face-to-Face location chat with current seller-guide changes preserved'
          gh auth setup-git
          git push origin HEAD:refs/heads/release/face-to-face-location-20261104
          git rev-parse HEAD
