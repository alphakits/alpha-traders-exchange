name: Android receipt store bundle verification
on:
  push:
    branches: [release/android-receipts-20261101]
    paths: [.github/workflows/android-receipt-store-build.yml]
permissions:
  contents: read
concurrency:
  group: alpha-android-receipt-verification-20261101
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bundle: ${{ steps.meta.outputs.build_id }}
    steps:
      - name: Read Android release and Google submission metadata
        id: meta
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const query=`query {
            app { byId(appId:"e5dbc3ba-25fb-4373-8ded-c8c80cadc147") {
              id androidAppCredentials(filter:{applicationIdentifier:"com.alphakits.alphatraders",legacyOnly:false}) {
                googleServiceAccountKeyForSubmissions { id } androidAppBuildCredentialsList { id }
              }
              builds(limit:20,offset:0,filter:{platform:ANDROID,buildProfile:"production"}) {
                id status distribution appIdentifier gitCommitHash appVersion appBuildVersion createdAt queuePosition estimatedWaitTimeLeftSeconds
              }
              submissions(limit:10,offset:0,filter:{platform:ANDROID}) {
                id status androidConfig {track releaseStatus} submittedBuild {id appBuildVersion}
              }
            }}
          }`;
          const r=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({query})});
          const json=await r.json(); if(!r.ok||json.errors) throw Error('EAS release metadata unavailable');
          const app=json.data.app.byId;
          const target=app.builds.filter(b=>b.gitCommitHash==='e217be0367e5ea4ffb598ebafbb63c5cf7de2865'&&b.appIdentifier==='com.alphakits.alphatraders'&&b.distribution==='STORE'&&!['ERRORED','CANCELED'].includes(b.status));
          const facts={selected:target,playSubmissionKeyAssigned:app.androidAppCredentials.some(c=>!!c.googleServiceAccountKeyForSubmissions),androidSigningConfigured:app.androidAppCredentials.some(c=>c.androidAppBuildCredentialsList.length>0),recentPlaySubmissions:app.submissions};
          console.log('ANDROID_PROVIDER '+JSON.stringify(facts));
          if(target.length!==1) throw Error('Expected exactly one current release build');
          appendFileSync(process.env.GITHUB_OUTPUT,'build_id='+target[0].id+'\n');
          JS
  verify:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      RECEIPT_BUILD_ID: ${{ needs.discover.outputs.bundle }}
      RECEIPT_SOURCE: e217be0367e5ea4ffb598ebafbb63c5cf7de2865
      EXPO_PROJECT: e5dbc3ba-25fb-4373-8ded-c8c80cadc147
      PACKAGE: com.alphakits.alphatraders
    steps:
      - name: Obtain the exact AAB from the owner’s EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const query=`query BundleProof($id:ID!) { builds { byId(buildId:$id) {
            id app { id } platform status distribution appIdentifier appVersion appBuildVersion gitCommitHash artifacts { applicationArchiveUrl }
          } } }`;
          let b;
          for (let observation=0;observation<110;observation++) {
            const res=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{
              Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'
            },body:JSON.stringify({query,variables:{id:process.env.RECEIPT_BUILD_ID}})});
            const data=await res.json();
            if(!res.ok||data.errors) throw Error('Expo could not verify the selected build');
            b=data.data?.builds?.byId;
            if(!b||['ERRORED','CANCELED'].includes(b.status)) throw Error('Android release bundle could not complete');
            if(b.status==='FINISHED') break;
            await new Promise(resolve=>setTimeout(resolve,45000));
          }
          if(b?.id!==process.env.RECEIPT_BUILD_ID||b.app?.id!==process.env.EXPO_PROJECT||b.platform!=='ANDROID'||b.status!=='FINISHED'||b.distribution!=='STORE'||b.gitCommitHash!==process.env.RECEIPT_SOURCE||b.appIdentifier!==process.env.PACKAGE) throw Error('EAS build identity mismatch');
          const file=b.artifacts?.applicationArchiveUrl;
          if(typeof file!=='string'||!file.startsWith('https://')) throw Error('Missing EAS Android archive');
          const archive=await fetch(file);
          if(!archive.ok) throw Error('EAS archive retrieval failed with HTTP '+archive.status);
          writeFileSync(process.env.RUNNER_TEMP+'/release.aab',Buffer.from(await archive.arrayBuffer()));
          writeFileSync(process.env.GITHUB_ENV,'EXPECTED_VERSION='+b.appVersion+'\nEXPECTED_CODE='+b.appBuildVersion+'\n',{flag:'a'});
          JS
      - name: Verify Android bundle package, version, signature and digest
        run: |
          set -euo pipefail
          export LC_ALL=C
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar' | sha256sum --check
          java -jar bundletool.jar validate --bundle=release.aab >/dev/null
          java -jar bundletool.jar dump manifest --bundle=release.aab --module=base > manifest.xml
          python3 - <<'PY'
          import os
          from xml.etree.ElementTree import parse
          manifest = parse("manifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          assert manifest.get("package") == os.environ["PACKAGE"]
          assert manifest.get(android + "versionCode") == os.environ["EXPECTED_CODE"]
          assert manifest.get(android + "versionName") == os.environ["EXPECTED_VERSION"]
          PY
          jarsigner -verify release.aab > signature.verify
          grep -Fxq 'jar verified.' signature.verify
          keytool -printcert -jarfile release.aab > certificate.info
          cert_sha="$(sed -nE 's/^[[:space:]]*SHA256: ([0-9A-F:]+)$/\1/p' certificate.info | head -1)"
          test "${#cert_sha}" -eq 95
          archive_sha="$(sha256sum release.aab | cut -d' ' -f1)"
          archive_size="$(stat -c%s release.aab)"
          printf 'ANDROID_VERIFIED bundle=%s version=%s versionCode=%s bytes=%s sha256=%s uploadCertificateSHA256=%s\n' "$PACKAGE" "$EXPECTED_VERSION" "$EXPECTED_CODE" "$archive_size" "$archive_sha" "$cert_sha"
