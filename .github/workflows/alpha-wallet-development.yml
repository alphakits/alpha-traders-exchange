name: Alpha Wallet Simulation-Only Development

"on":
  push:
    branches:
      - feature/alpha-wallet-dev-20261104
    paths-ignore:
      - docs/alpha-wallet/*.md
      - docs/alpha-wallet/*results*.json
      - docs/alpha-wallet/previews/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-wallet-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-simulation:
    name: Wallet, recovery and browser verification with synthetic funds
    if: ${{ github.ref == 'refs/heads/feature/alpha-wallet-dev-20261104' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: alpha_wallet_dev_races
          POSTGRES_USER: wallet_fixture
          POSTGRES_PASSWORD: simulation-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_fixture -d alpha_wallet_dev_races"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the development commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies and local dependency patches
        run: npm ci

      - name: Prepare simulation evidence directory
        run: mkdir -p test-results/alpha-wallet

      - name: Run the wallet unit and local persistence suite
        run: |
          set -euo pipefail
          node ./node_modules/vitest/vitest.mjs run src/lib/alpha-wallet --maxWorkers=2 \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/alpha-wallet/unit-results.json \
            2>&1 | tee test-results/alpha-wallet/unit-tests.log

      - name: Check TypeScript across the project
        run: |
          set -euo pipefail
          node ./node_modules/typescript/bin/tsc --noEmit --incremental false --pretty false \
            2>&1 | tee test-results/alpha-wallet/typecheck.log

      - name: Verify retained platform authentication contracts with isolated stores
        run: |
          set -euo pipefail
          node ./node_modules/vitest/vitest.mjs run \
            src/__tests__/session-expiry-validation.test.ts \
            src/__tests__/authenticated-session-source.test.ts \
            src/__tests__/api-auth.test.ts \
            src/lib/mobile-auth.test.ts \
            src/lib/mobile-phone-enforcement.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/alpha-wallet/platform-auth-results.json \
            2>&1 | tee test-results/alpha-wallet/platform-auth-tests.log

      - name: Verify retained marketplace transaction and storage contracts
        run: |
          set -euo pipefail
          node ./node_modules/vitest/vitest.mjs run \
            src/__tests__/alpha-exchange-repository.test.ts \
            src/__tests__/targeted-transaction-recovery.test.ts \
            src/__tests__/wise-storage-postgres.test.ts \
            src/__tests__/owner-completed-trade-history.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/alpha-wallet/marketplace-regression-results.json \
            2>&1 | tee test-results/alpha-wallet/marketplace-regression-tests.log

      - name: Run the existing offline wallet simulation
        run: |
          set -euo pipefail
          node --import tsx scripts/alpha-wallet/demo.ts \
            2>test-results/alpha-wallet/simulation-demo.stderr.log \
            | tee test-results/alpha-wallet/simulation-demo.json

      - name: Verify independent processes against disposable PostgreSQL
        run: |
          set -euo pipefail
          node --import tsx scripts/alpha-wallet/postgres-concurrency.ts \
            --fresh-simulation-database \
            --connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_races' \
            2>test-results/alpha-wallet/postgres-concurrency.stderr.log \
            | tee test-results/alpha-wallet/postgres-concurrency.json

      - name: Prepare empty disposable recovery and marketplace databases
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const connection = new pg.Client({ connectionString: 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_races' });
          await connection.connect();
          try {
            await connection.query('CREATE DATABASE alpha_wallet_dev_backup_source');
            await connection.query('CREATE DATABASE alpha_wallet_dev_restore_target');
            await connection.query('CREATE DATABASE alpha_wallet_dev_marketplace');
            await connection.query('CREATE DATABASE alpha_wallet_dev_v2_source');
            await connection.query('CREATE DATABASE alpha_wallet_dev_v2_restore');
            await connection.query('CREATE DATABASE alpha_wallet_dev_coordination_atomic');
            await connection.query('CREATE DATABASE alpha_wallet_dev_coordination_races');
            await connection.query('CREATE DATABASE alpha_wallet_dev_coordination_auth');
          } finally { await connection.end(); }
          NODE

      - name: Verify backup and paused restore on disposable PostgreSQL
        run: |
          set -euo pipefail
          node --import tsx scripts/alpha-wallet/postgres-backup.ts \
            --fresh-simulation-databases \
            --source-connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_backup_source' \
            --target-connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_restore_target' \
            2>test-results/alpha-wallet/postgres-backup.stderr.log \
            | tee test-results/alpha-wallet/postgres-backup.json

      - name: Verify actual marketplace SQL and wallet commands in one transaction
        run: |
          set -euo pipefail
          node --conditions=react-server --import tsx scripts/alpha-wallet/postgres-marketplace-transaction.ts \
            --fresh-simulation-database \
            --connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_marketplace' \
            2>test-results/alpha-wallet/postgres-marketplace-transaction.stderr.log \
            | tee test-results/alpha-wallet/postgres-marketplace-transaction.json

      - name: Verify explicit v2 upgrade, resize, inherited recovery and mixed restore
        run: |
          set -euo pipefail
          node --conditions=react-server --import tsx scripts/alpha-wallet/postgres-versioned-ledger.ts \
            --fresh-simulation-databases \
            --source-connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_v2_source' \
            --target-connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_v2_restore' \
            2>test-results/alpha-wallet/postgres-versioned-ledger.stderr.log \
            | tee test-results/alpha-wallet/postgres-versioned-ledger.json

      - name: Verify canonical marketplace coordination, writer fences and web authentication races
        run: |
          set -euo pipefail
          node --conditions=react-server --import tsx scripts/alpha-wallet/postgres-marketplace-coordinator.ts \
            --fresh-simulation-databases \
            --atomic-connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_coordination_atomic' \
            --race-connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_coordination_races' \
            --auth-connection-string 'postgresql://wallet_fixture:simulation-only@127.0.0.1:5432/alpha_wallet_dev_coordination_auth' \
            2>test-results/alpha-wallet/postgres-marketplace-coordinator.stderr.log \
            | tee test-results/alpha-wallet/postgres-marketplace-coordinator.json

      - name: Install the locked Playwright Chromium browser
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Rehearse the English desktop and Arabic mobile wallet in Chromium
        run: |
          set -euo pipefail
          node --import tsx scripts/alpha-wallet/rehearsal-browser-check.ts \
            2>test-results/alpha-wallet/rehearsal-browser.stderr.log \
            | tee test-results/alpha-wallet/rehearsal-browser.json

      - name: Preserve simulation verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-wallet-simulation-evidence-${{ github.sha }}
          path: test-results/alpha-wallet/
          if-no-files-found: warn
          retention-days: 14
