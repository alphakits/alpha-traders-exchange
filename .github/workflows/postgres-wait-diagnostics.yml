name: Isolated PostgreSQL wait diagnostics

on:
  push:
    branches: [audit/postgres-wait-diagnostics-20261018]

permissions:
  contents: read

jobs:
  diagnose:
    name: Fixed diagnostic trial ${{ matrix.trial }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: alpha_exchange_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_exchange_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALPHA_AUDIT_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/alpha_exchange_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enable WAL timing only in this disposable test container
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d alpha_exchange_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET track_wal_io_timing = on"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d alpha_exchange_ci -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
      - name: Run unchanged correctness and concurrency workload
        run: node scripts/check-postgres-concurrency.mjs
      - name: Keep the unchanged one-second acceptance threshold
        run: node scripts/check-postgres-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-wait-diagnostics-${{ matrix.trial }}
          path: test-results/postgres-concurrency/
          if-no-files-found: error
          retention-days: 14
