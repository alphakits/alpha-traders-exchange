name: Native audit status snapshot

on:
  push:
    branches: [fix/native-status-*]
    paths: [.github/workflows/native-audit-status.yml]

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    name: Read current native workflow status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: native-audit-result
          run-id: 37174652077
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-completed
      - run: npm ci
      - name: Read workflow metadata without starting builds or tests
        working-directory: apps/mobile
        run: |
          eas workflow:runs --limit 8 --json > native-workflow-runs.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const completed = JSON.parse(fs.readFileSync('../../native-completed/native-audit-result.json', 'utf8'));
          if (completed.gitCommitHash !== '055efe49dd203c33d0ed0dd41ad07441f59b8aaa') throw new Error('Completed native source differs');
          for (const job of completed.jobs ?? []) {
            const build = job.turtleBuild;
            if (job.key === 'android_navigation') {
              const archive = (job.turtleJobRun?.artifacts ?? []).find(item => item.filename === 'artifacts.tar.gz');
              if (!archive || archive.fileSizeBytes > 150000000) throw new Error('Android trace archive unavailable');
              const url = new URL(archive.downloadUrl);
              if (url.protocol !== 'https:' || url.hostname !== 'wf-artifacts.eascdn.net') throw new Error('Unexpected Android trace origin');
              const response = await fetch(archive.downloadUrl, { signal: AbortSignal.timeout(45000) });
              if (!response.ok) throw new Error('Could not fetch Android trace');
              const path = 'native-android-report.tar.gz';
              fs.writeFileSync(path, Buffer.from(await response.arrayBuffer()));
              const list = spawnSync('tar', ['-tzf', path], { encoding: 'utf8', maxBuffer: 8000000 });
              if (list.status !== 0) throw new Error('Invalid Android report archive');
              const names = list.stdout.split('\n').filter(Boolean);
              if (names.some(name => name.startsWith('/') || name.split('/').includes('..'))) throw new Error('Unsafe report entry');
              const selectedNames = names.filter(name => name.includes('terms-en') && name.endsWith('.json'));
              console.log(JSON.stringify({ androidArchiveEntries: selectedNames }));
              for (const name of selectedNames) {
                const text = spawnSync('tar', ['-xOzf', path, '--', name], { encoding: 'utf8', maxBuffer: 8000000 });
                if (text.status !== 0) throw new Error('Could not read Android command trace');
                console.log(JSON.stringify({ androidTraceFile: name, trace: text.stdout.slice(0,25000) }));
              }
            }
            if (build) console.log(JSON.stringify({ nativeBuild: { job: job.key, id: build.id, status: build.status, platform: build.platform, profile: build.buildProfile, version: build.appVersion, buildNumber: build.appBuildVersion, source: build.gitCommitHash, simulator: build.isForIosSimulator } }));
            for (const artifact of job.turtleJobRun?.artifacts ?? []) {
              if (!artifact.filename?.toLowerCase().endsWith('.xml')) continue;
              const url = new URL(artifact.downloadUrl);
              if (url.protocol !== 'https:' || url.hostname !== 'wf-artifacts.eascdn.net') throw new Error('Unexpected completed report origin');
              const response = await fetch(artifact.downloadUrl, { signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error('Could not fetch completed native report');
              const junit = await response.text();
              fs.writeFileSync('native-junit-' + completed.id + '-' + job.key + '.xml', junit);
              console.log(JSON.stringify({ run: completed.id, source: completed.gitCommitHash, job: job.key, junit }));
            }
          }
          const raw = JSON.parse(fs.readFileSync('native-workflow-runs.json', 'utf8'));
          const runs = Array.isArray(raw) ? raw : raw.workflowRuns ?? raw.runs ?? [];
          if (!Array.isArray(runs)) throw new Error('Unexpected workflow list shape');
          const sources = new Set(['055efe49dd203c33d0ed0dd41ad07441f59b8aaa', '60008e9da12e40dd42f1c08d1e65fe5dab625bc1']);
          const selected = runs.filter(run => run.status === 'IN_PROGRESS' || sources.has(run.gitCommitHash));
          console.log(JSON.stringify({ selected: selected.map(run => ({ id: run.id, status: run.status, source: run.gitCommitHash })) }));
          for (const run of selected) {
            if (!/^[a-f0-9-]{36}$/i.test(run.id)) throw new Error('Invalid returned workflow ID');
            const result = spawnSync('eas', ['workflow:view', run.id, '--json', '--non-interactive'], { encoding: 'utf8', timeout: 60000 });
            if (result.status !== 0) throw new Error('Could not read workflow status');
            const view = JSON.parse(result.stdout);
            fs.writeFileSync('native-workflow-' + run.id + '.json', JSON.stringify(view, null, 2));
            console.log(JSON.stringify({ id: view.id, status: view.status, source: view.gitCommitHash, jobs: (view.jobs ?? []).map(job => ({ key: job.key, status: job.status, type: job.type })) }));
            for (const job of view.jobs ?? []) {
              for (const artifact of job.turtleJobRun?.artifacts ?? []) {
                if (!artifact.filename?.toLowerCase().endsWith('.xml')) continue;
                const url = new URL(artifact.downloadUrl);
                if (url.protocol !== 'https:' || url.hostname !== 'wf-artifacts.eascdn.net') throw new Error('Unexpected report origin');
                const response = await fetch(artifact.downloadUrl, { signal: AbortSignal.timeout(30000) });
                if (!response.ok) throw new Error('Could not fetch current native report');
                const junit = await response.text();
                fs.writeFileSync('native-junit-' + run.id + '-' + job.key + '.xml', junit);
                console.log(JSON.stringify({ run: run.id, source: view.gitCommitHash, job: job.key, junit }));
              }
            }
          }
          JS
      - name: Preserve metadata snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-status-snapshot
          path: |
            apps/mobile/native-workflow-*.json
            apps/mobile/native-junit-*.xml
          if-no-files-found: error
          retention-days: 14
