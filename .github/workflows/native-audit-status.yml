name: Native Completed Journey Evidence

on:
  push:
    branches: [fix/native-status-*]
    paths: [.github/workflows/native-audit-status.yml]

permissions:
  contents: read
  actions: read

jobs:
  completed-evidence:
    name: Verify all eighteen installed journeys from completed JUnit reports
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: native-audit-result
          run-id: 37174652077
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-new-baseline
      - uses: actions/download-artifact@v4
        with:
          name: native-ui-recheck-result
          run-id: 37175709005
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-prior-baseline
      - uses: actions/download-artifact@v4
        with:
          name: native-android-recheck-result
          run-id: 37180538596
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-new-android
      - uses: actions/download-artifact@v4
        with:
          name: native-android-recheck-result
          run-id: 37179743637
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-prior-android
      - uses: actions/download-artifact@v4
        with:
          name: native-ios-recheck-result
          run-id: 37180374325
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-prior-ios
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: "11294032159"
          run-id: 37177511376
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-new-baseline-archive
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: "11294660135"
          run-id: 37178555615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: native-prior-baseline-archive
      - name: Require all unique native journeys to pass across the exact completed runs
        run: |
          node --input-type=module <<'JS'
          await (async function completedJourneys() {
           const fs=await import("node:fs");
           const documents=[{"label":"new-baseline","cohort":"new","directory":"native-new-baseline","run":37174652077,"name":"native-audit-result","filename":"native-audit-result.json","source":"055efe49dd203c33d0ed0dd41ad07441f59b8aaa"},{"label":"prior-baseline","cohort":"prior","directory":"native-prior-baseline","run":37175709005,"name":"native-ui-recheck-result","filename":"native-audit-result.json","source":"60008e9da12e40dd42f1c08d1e65fe5dab625bc1"},{"label":"new-android","cohort":"new","directory":"native-new-android","run":37180538596,"name":"native-android-recheck-result","filename":"native-android-recheck-result.json","source":"8200ceaf35e9a4406f664e07b0b623bd814483af","focused":true},{"label":"prior-android","cohort":"prior","directory":"native-prior-android","run":37179743637,"name":"native-android-recheck-result","filename":"native-android-recheck-result.json","source":"bf3ca8ddd007d5f39e3e5db4e06baed81bf20694","focused":true},{"label":"prior-ios","cohort":"prior","directory":"native-prior-ios","run":37180374325,"name":"native-ios-recheck-result","filename":"native-ios-recheck-result.json","source":"9be40864c1dc21c38d338010a1af211c9df14144","focused":true}];
           const results=[];const current=new Map();
           const platform={android_navigation:"android-35",android_terms_en:"android-35",ios_navigation:"ios-18.3",ios_terms_en:"ios-18.3",legacy_android_recovery:"android-29"};
           for(const document of documents){
            const paths=[document.directory+"/"+document.filename,document.directory+"/apps/mobile/"+document.filename];
            const existing=paths.filter(path=>fs.existsSync(path));
            if(existing.length!==1)throw new Error("Completed native result is missing or duplicated.");
            const workflow=JSON.parse(fs.readFileSync(existing[0],"utf8"));
            if(workflow.gitCommitHash!==document.source)throw new Error("Native artifact source mismatch.");
            if(document.focused&&workflow.status!=="SUCCESS")throw new Error("Focused native journey did not pass.");
            const cases=[];
            for(const job of workflow.jobs??[]){
             if(!platform[job.key])continue;
             const reports=(job.turtleJobRun?.artifacts??[]).filter(a=>a.filename?.endsWith(".xml"));
             if(reports.length!==1)throw new Error("Expected exactly one zero-retry JUnit report per native job.");
             for(const report of reports){
              let xml;
              if(!document.focused){
               const archivedDirectory=document.directory+"-archive";
               const metadataPath=archivedDirectory+"/native-workflow-"+workflow.id+".json";
               const reportPath=archivedDirectory+"/native-junit-"+workflow.id+"-"+job.key+".xml";
               if(!fs.existsSync(metadataPath)||!fs.existsSync(reportPath))throw new Error("Archived native evidence is missing.");
               const archived=JSON.parse(fs.readFileSync(metadataPath,"utf8"));
               if(archived.id!==workflow.id||archived.gitCommitHash!==document.source||archived.status!==workflow.status)throw new Error("Archived native source or completion mismatch.");
               xml=fs.readFileSync(reportPath,"utf8");
              }else{
               const url=new URL(report.downloadUrl);
               if(url.protocol!=="https:"||url.hostname!=="wf-artifacts.eascdn.net")throw new Error("Unexpected native report origin.");
               const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
               if(!response.ok)throw new Error("Could not read completed native JUnit.");
               xml=await response.text();
              }
              if(xml.length>500000||/<!DOCTYPE|<!ENTITY/i.test(xml))throw new Error("Unexpected JUnit document.");
              fs.writeFileSync("native-junit-"+document.label+"-"+job.key+".xml",xml);
              for(const match of xml.matchAll(/<testcase\b([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g)){
               const attrs=Object.fromEntries([...match[1].matchAll(/([\w-]+)="([^"]*)"/g)].map(m=>[m[1],m[2]]));
               if(!attrs.name)throw new Error("Native testcase has no name.");
               const failed=/<(?:failure|error)\b/.test(match[2]??"")||attrs.status==="ERROR";
               const skipped=/<skipped\b/.test(match[2]??"")||attrs.status==="SKIPPED";
               const item={cohort:document.cohort,platform:platform[job.key],name:attrs.name,status:failed?"failed":skipped?"skipped":"passed",durationSeconds:Number(attrs.time),source:document.source,githubRun:document.run,easRun:workflow.id};
               cases.push(item);
               const key=[item.cohort,item.platform,item.name].join("|");
               if(item.status==="passed"||!current.has(key))current.set(key,item);
              }
             }
            }
            if(document.focused&&(cases.length!==1||cases[0].status!=="passed"))throw new Error("Focused evidence does not contain exactly one passed journey.");
            if(!document.focused&&cases.length!==9)throw new Error("Baseline evidence does not contain nine journeys.");
            results.push({label:document.label,source:document.source,githubRun:document.run,easRun:workflow.id,status:workflow.status,cases});
           }
           const unique=[...current.values()];
           const groups={};
           for(const item of unique){const key=item.cohort+":"+item.platform;groups[key]??={total:0,passed:0};groups[key].total++;if(item.status==="passed")groups[key].passed++;}
           for(const cohort of ["new","prior"])for(const [system,count]of Object.entries({"android-35":4,"ios-18.3":4,"android-29":1})){const group=groups[cohort+":"+system];if(!group||group.total!==count||group.passed!==count)throw new Error("Installed native coverage is incomplete.");}
           const evidence={checkedAt:new Date().toISOString(),groups,totalUnique:unique.length,passedUnique:unique.filter(x=>x.status==="passed").length,combinedAcrossCompletedRuns:true,results,unique};
           fs.writeFileSync("native-completed-journeys.json",JSON.stringify(evidence,null,2));
           console.log(JSON.stringify({checkedAt:evidence.checkedAt,groups,totalUnique:evidence.totalUnique,passedUnique:evidence.passedUnique,combinedAcrossCompletedRuns:true}));
          })();
          JS
      - name: Preserve completed native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-completed-journeys
          path: |
            native-completed-journeys.json
            native-junit-*.xml
          if-no-files-found: error
          retention-days: 30
