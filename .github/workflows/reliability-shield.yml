name: Reliability Shield

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: reliability-shield-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://www.alphatraders.co.il
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  postgres-concurrency:
    name: PostgreSQL concurrency and transaction recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: alpha_exchange_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_exchange_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALPHA_AUDIT_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/alpha_exchange_ci
      ALPHA_AUDIT_WAIT_DIAGNOSTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify isolation of database audit tools
        run: node --test scripts/test-audit-database-url.mjs
      - name: Enable wait diagnostics in the disposable database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d alpha_exchange_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET track_wal_io_timing = on"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d alpha_exchange_ci -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
      - name: Exercise real database races and process recovery
        run: node scripts/check-postgres-concurrency.mjs
      - name: Recover provider history through process crashes and HTTP outages
        run: node scripts/check-commission-history-recovery.mjs
      - name: Back up and restore controlled database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d alpha_exchange_ci -Fc > test-results/postgres-concurrency/controlled-backup.dump
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres alpha_exchange_restore_ci
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U postgres -d alpha_exchange_restore_ci --exit-on-error < test-results/postgres-concurrency/controlled-backup.dump
          node scripts/check-postgres-restoration.mjs
      - name: Enforce the subsecond database action target
        run: node scripts/check-postgres-performance.mjs
      - name: Preserve database verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-concurrency-evidence
          path: test-results/postgres-concurrency/
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    name: Unit, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the release safety gate
        run: npm run verify:release

      - name: Verify the continuous public monitor contracts
        run: python3 -m unittest discover -s scripts -p test_production_health.py -v

      - name: Verify the packaged continuous monitor worker
        run: |
          docker build -f Dockerfile.discord-worker -t alpha-discord-worker:ci .
          docker run --rm --entrypoint sh alpha-discord-worker:ci -c 'python3 --version && curl --version && test -r scripts/production_health.py'

  critical-browser-flows:
    name: Mobile and desktop critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Verify the first click after section navigation
        run: node scripts/check-section-navigation.mjs --browser=chromium

      - name: Verify authenticated marketplace and Trade Room flows
        run: npm run test:e2e

      - name: Repeat commission fee and carry-forward acceptance without retries
        run: npm run test:e2e -- e2e/commission-carry-forward.spec.ts --retries=0 --repeat-each=3 --output=test-results/commission-repeat

      - name: Verify the bilingual trading journal and saved records
        run: |
          node scripts/build-journal-preview.mjs test-results/journal/Alpha-Traders-Trading-Journal.html
          node scripts/verify-journal-preview.mjs test-results/journal/Alpha-Traders-Trading-Journal.html

      - name: Preserve journal screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-journal-review
          path: test-results/journal/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve owner header visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-header-mobile-screenshots
          path: test-results/**/owner-trades-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve offer limits and connection recovery screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-audit-screenshots
          path: |
            test-results/**/offer-boundary-*.png
            test-results/**/connection-*.png
            test-results/**/seller-only-*.png
            test-results/**/atm-*.png
            test-results/**/bank-*.png
            test-results/**/commission-*.png
            test-results/**/owner-editor-*.png
            test-results/**/login-*-structured-rejection.png
          if-no-files-found: error
          retention-days: 7

      - name: Preserve profile phone and desktop visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-workspace-screenshots
          path: test-results/**/profile-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-shield-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve failure summaries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-shield-playwright-summaries
          path: test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  phone-verification-gate:
    name: Mandatory phone gates and owner exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify mandatory phone gates and exact owner exceptions
        run: npm run test:e2e:phone-verification
      - name: Preserve adult confirmation visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adult-confirmation-screenshots
          path: test-results/**/adult-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mandatory-phone-verification-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-browser-flows:
    name: WebKit critical flows (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Keep the browser and OS dependencies pinned together; repeated Ubuntu
    # mirror stalls must not consume the browser regression job's time budget.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify pinned WebKit runtime
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          assert.equal(require('playwright/package.json').version, '1.61.1',
            'Update the pinned Playwright image together with the package lock.');
          const { webkit } = require('playwright');
          (async () => {
            const browser = await webkit.launch();
            console.log(`Pinned WebKit runtime ready: ${browser.version()}`);
            await browser.close();
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Verify the first click after section navigation in WebKit
        if: matrix.shard == 1
        run: node scripts/check-section-navigation.mjs --browser=webkit
      - name: Verify seller keyboard navigation before the full WebKit group
        if: matrix.shard == 3
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-navigation-preflight.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.config.ts e2e/navigation-hardening.spec.ts --grep="seller refresh keeps the approved workspace stable" --max-failures=1 --reporter=list,json
      - name: Verify cross-page listing navigation without retries
        if: matrix.shard == 3
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-cross-page-navigation.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.config.ts e2e/navigation-hardening.spec.ts --grep="header create listing reaches the form from My Trades" --repeat-each=3 --retries=0 --max-failures=1 --reporter=list,json
      - name: Preserve focused WebKit navigation evidence
        if: always() && matrix.shard == 3
        uses: actions/upload-artifact@v4
        with:
          name: webkit-navigation-preflight
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify owner login destination before the full WebKit group
        if: matrix.shard == 4
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-owner-login-preflight.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.config.ts e2e/seller-listing-lifecycle.spec.ts --grep="owner listing notification destination survives login, refresh, and history navigation" --repeat-each=3 --max-failures=1 --reporter=list,json
      - name: Preserve focused WebKit owner login evidence
        if: always() && matrix.shard == 4
        uses: actions/upload-artifact@v4
        with:
          name: webkit-owner-login-preflight
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify marketplace, payments and owner flows in WebKit
        # The focus-race regressions also run three times in isolation below
        # through the same release-blocking browser job.
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-critical-results.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.config.ts --shard=${{ matrix.shard }}/4 --reporter=list,json
      - name: Preserve WebKit browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-critical-flows-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify completed logout navigation without retries
        if: success() && matrix.shard == 1
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-logout-regression.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.config.ts e2e/auth.spec.ts --grep="logout clears session and requires login for protected pages" --repeat-each=3 --retries=0 --max-failures=1 --reporter=list,json
      - name: Preserve focused WebKit logout evidence
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: webkit-logout-regression
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify profile keyboard focus without retries
        if: success() && matrix.shard == 3
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-profile-focus-regression.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.config.ts e2e/profile-workspace.spec.ts --grep="Arabic profile tabs support RTL keyboard navigation" --repeat-each=3 --retries=0 --max-failures=1 --reporter=list,json
      - name: Preserve focused WebKit profile evidence
        if: always() && matrix.shard == 3
        uses: actions/upload-artifact@v4
        with:
          name: webkit-profile-focus-regression
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify Trade Room chat focus and Poke without retries
        if: success() && matrix.shard == 4
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-chat-focus-regression.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.config.ts e2e/trade-room-guided-flow-hardening.spec.ts --grep="Trade Room Poke is recipient-only" --repeat-each=3 --retries=0 --max-failures=1 --reporter=list,json
      - name: Preserve focused WebKit chat evidence
        if: always() && matrix.shard == 4
        uses: actions/upload-artifact@v4
        with:
          name: webkit-chat-focus-regression
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify mandatory phone and age gates in WebKit
        id: webkit_phone_gates
        if: success() && matrix.shard == 1
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit-phone-results.json
        run: node ./node_modules/playwright/cli.js test --config=playwright.webkit.phone-verification.config.ts --reporter=list,json
      - name: Preserve WebKit phone and age evidence
        if: always() && matrix.shard == 1 && steps.webkit_phone_gates.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: webkit-phone-age-gates
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  usdt-request-flows:
    name: Buy Requests production flow and accessibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      USDT_OFFLINE_PRODUCTION: "1"
      USDT_OFFLINE_BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/usdt-production-results.json
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated browser runtime
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build the release source
        run: npm run build
      - name: Verify isolated Buy Requests flows without retries
        run: node ./node_modules/playwright/cli.js test --config=playwright.usdt-requests-offline.config.ts --reporter=list,json
      - name: Preserve Buy Requests results, accessibility reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdt-production-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  release-acceptance:
    name: Release acceptance
    if: always()
    needs: [quality-gate, postgres-concurrency, critical-browser-flows, phone-verification-gate, webkit-browser-flows, usdt-request-flows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every independent regression job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality-gate.result }}
          DATABASE_RESULT: ${{ needs.postgres-concurrency.result }}
          BROWSER_RESULT: ${{ needs.critical-browser-flows.result }}
          PHONE_RESULT: ${{ needs.phone-verification-gate.result }}
          WEBKIT_RESULT: ${{ needs.webkit-browser-flows.result }}
          USDT_RESULT: ${{ needs.usdt-request-flows.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$PHONE_RESULT" = success
          test "$WEBKIT_RESULT" = success
          test "$USDT_RESULT" = success
